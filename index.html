<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>モツーズ・カシラ参戦版</title>
    <style>
        body { background: #333; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; overflow: hidden; touch-action: none; }
        #game-screen { position: relative; width: 360px; height: 500px; background: skyblue; border: 4px solid #fff; margin-top: 20px; overflow: hidden; }
        
        #player {
            position: absolute; bottom: 10px; width: 70px; height: 70px;
            background-size: contain; background-repeat: no-repeat; background-position: center;
            z-index: 10; transition: left 0.1s ease-out;
            border: 2px solid yellow; /* デバッグ用枠線 */
        }

        .motsu {
            position: absolute; width: 60px; height: 60px;
            background-size: contain; background-repeat: no-repeat; background-position: center;
            z-index: 5;
            border: 1px dashed white; /* デバッグ用枠線 */
        }

        #score-board { position: absolute; top: 10px; width: 100%; text-align: center; font-size: 24px; color: white; font-weight: bold; text-shadow: 2px 2px #000; z-index: 20; }
        #controls { display: flex; gap: 30px; margin-top: 20px; }
        .btn { width: 120px; height: 80px; font-size: 40px; color: white; background: #ff9900; border: none; border-bottom: 6px solid #cc7700; border-radius: 20px; }
    </style>
</head>
<body>

    <div id="game-screen">
        <div id="score-board">スコア: 0</div>
        <div id="player" style="background-image: url('./images/player.png');"></div>
    </div>

    <div id="controls">
        <button class="btn" onclick="moveLeft()">◀</button>
        <button class="btn" onclick="moveRight()">▶</button>
    </div>

    <script>
        const screen = document.getElementById('game-screen');
        const player = document.getElementById('player');
        const scoreDisplay = document.getElementById('score-board');
        
        let score = 0;
        let playerLine = 2;
        const totalLines = 5;
        const lineWidth = 360 / totalLines;

        // モツのリスト（カシラを追加）
        const motsuTypes = [
            { name: 'シロ', img: './images/shiro.png' },
            { name: 'ハツ', img: './images/hatsu.png' },
            { name: 'レバー', img: './images/lever.png' },
            { name: 'ガツ', img: './images/gatsu.png' },
            { name: 'アブラ', img: './images/abura.png' },
            { name: 'ナンコツ', img: './images/nankotsu.png' },
            { name: 'カシラ', img: './images/kasira.png' } // ←ここに追加しました
        ];

        // 画像の読み込みテスト（コンソールで確認用）
        motsuTypes.forEach(m => {
            const testImg = new Image();
            testImg.onload = () => console.log(`読み込み成功: ${m.name}`);
            testImg.onerror = () => console.error(`読み込み失敗: ${m.name} (${m.img})`);
            testImg.src = m.img;
        });

        function updatePlayerPos() {
            player.style.left = (playerLine * lineWidth + (lineWidth - 70)/2) + 'px';
        }
        updatePlayerPos();

        window.moveLeft = () => { if(playerLine > 0) playerLine--; updatePlayerPos(); };
        window.moveRight = () => { if(playerLine < totalLines - 1) playerLine++; updatePlayerPos(); };

        function spawnMotsu() {
            const motsu = document.createElement('div');
            const type = motsuTypes[Math.floor(Math.random() * motsuTypes.length)];
            const line = Math.floor(Math.random() * totalLines);
            
            motsu.className = 'motsu';
            motsu.style.backgroundImage = `url('${type.img}')`;
            motsu.style.left = (line * lineWidth + (lineWidth - 60)/2) + 'px';
            motsu.style.top = '-70px';
            screen.appendChild(motsu);

            let top = -70;
            function fall() {
                top += 2.5; // 少しだけスピードアップ
                motsu.style.top = top + 'px';

                if (top > 380 && top < 450 && line === playerLine) {
                    score += 10;
                    scoreDisplay.innerText = "スコア: " + score;
                    motsu.remove();
                    return;
                }
                if (top > 500) { motsu.remove(); return; }
                requestAnimationFrame(fall);
            }
            requestAnimationFrame(fall);
        }
        setInterval(spawnMotsu, 1800);
    </script>
</body>
</html>
