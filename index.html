<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>アキエクライシス - Ver.Final</title>
    <style>
        html, body { overflow: hidden; width: 100%; height: 100%; position: fixed; }
        body { background: #1a0000; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; touch-action: none; font-family: sans-serif; -webkit-user-select: none; user-select: none; }
        #game-screen { position: relative; width: 360px; height: 500px; background: #222; border: 4px solid #440000; margin-top: 10px; overflow: hidden; border-radius: 10px; }
        
        .bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s; z-index: 1; pointer-events: none;}
        .bg-active { opacity: 1; }
        #bg-danger { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('./images/background_danger.png'); background-size: cover; background-position: center; opacity: 0; transition: opacity 0.5s; z-index: 2; pointer-events: none; }
        .danger-active { opacity: 1 !important; }

        #damage-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: red; opacity: 0; pointer-events: none; z-index: 50; }
        #player { position: absolute; bottom: 10px; width: 70px; height: 70px; background-image: url('./images/player1.png'); background-size: contain; background-repeat: no-repeat; background-position: center; z-index: 10; will-change: left; }
        
        .motsu { position: absolute; width: 60px; height: 60px; background-size: contain; background-repeat: no-repeat; background-position: center; z-index: 5; animation: puripuri 1s infinite; will-change: top; }
        .char-mode { filter: drop-shadow(0 0 15px #ff0000) brightness(1.2) contrast(1.5); animation: puripuri 0.2s infinite !important; z-index: 7 !important; }
        .item-umewari { filter: drop-shadow(0 0 12px #ff00ff); z-index: 6 !important; }

        .crisis-title { font-size: 38px; font-weight: 900; color: #fff; text-shadow: 0 0 10px #ff0000, 3px 3px 0 #880000; margin: 5px 0; font-style: italic; text-align: center; }
        #best-info-container { margin: 5px 0 15px 0; padding: 10px 15px; background: rgba(255,255,255,0.1); border-radius: 15px; border: 1px solid #555; font-size: 14px; color: #ccc; text-align: center; min-width: 200px; }
        #best-shogo-text { font-weight: bold; font-size: 18px; display: block; margin-top: 5px; }
        #best-score-text { font-family: monospace; color: #0f0; font-size: 16px; font-weight: bold; }

        @keyframes puripuri { 0%, 49% { transform: scaleX(1); } 50%, 100% { transform: scaleX(-1); } }
        @keyframes shiver { 0% { transform: translate(0, 0); } 25% { transform: translate(1px, -1px); } 50% { transform: translate(-1px, 1px); } 100% { transform: translate(0, 0); } }
        .shivering { animation: shiver 0.1s infinite !important; }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 20px; box-sizing: border-box; }
        .denpyo { background: #fdfdf5; color: #333; padding: 15px; width: 240px; box-shadow: 5px 5px 15px rgba(0,0,0,0.5); font-family: monospace; border-top: 4px dotted #ccc; border-bottom: 4px dotted #ccc; margin-bottom: 15px; transform: rotate(1deg); }
        .denpyo h2 { text-align: center; border-bottom: 2px solid #333; margin: 0 0 10px 0; }
        .denpyo-row { display: flex; justify-content: space-between; font-size: 14px; margin: 4px 0; }
        .total-row { font-size: 22px; font-weight: bold; border-top: 2px solid #333; margin-top: 10px; padding-top: 5px; display: flex; justify-content: space-between; }
        
        .shogo-stamp { color: rgba(200, 0, 0, 0.7); border: 3px double rgba(200, 0, 0, 0.7); padding: 5px; transform: rotate(-12deg); font-weight: bold; margin-top: 15px; text-align: center; font-size: 20px; width: 100%; box-sizing: border-box; }
        .shogo-legend { background: linear-gradient(to bottom, #ffe000 0%, #7a5a00 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 28px !important; filter: drop-shadow(2px 2px 0px #000); border: 4px double #7a5a00 !important; color: #ffe000 !important; padding: 8px !important; }

        .confetti { position: absolute; width: 8px; height: 8px; z-index: 101; pointer-events: none; border-radius: 2px; }
        .action-btn { padding: 12px 20px; font-size: 24px; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; background: #aa0000; border-bottom: 5px solid #660000; width: 220px; margin-top: 10px; outline: none; }
        .secondary-btn { background: #444; border-bottom: 5px solid #222; }

        #ui-layer { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-around; color: white; font-weight: bold; text-shadow: 2px 2px #000; z-index: 20; pointer-events: none; }
        #controls { display: flex; gap: 30px; margin-top: 15px; }
        .btn { width: 120px; height: 80px; font-size: 40px; color: white; background: #880000; border: none; border-bottom: 6px solid #440000; border-radius: 20px; cursor: pointer; touch-action: none; outline: none; }
    </style>
</head>
<body>

    <div id="game-screen">
        <div id="bg0" class="bg-layer bg-active" style="background-image: url('./images/background1.png');"></div>
        <div id="bg1" class="bg-layer" style="background-image: url('./images/background2.png');"></div>
        <div id="bg2" class="bg-layer" style="background-image: url('./images/background3.png');"></div>
        <div id="bg3" class="bg-layer" style="background-image: url('./images/background4.png');"></div>
        <div id="bg4" class="bg-layer" style="background-image: url('./images/background5.png');"></div>
        <div id="bg5" class="bg-layer" style="background-image: url('./images/background6.png');"></div>
        <div id="bg-danger"></div>
        <div id="damage-flash"></div>

        <div id="title-screen" class="overlay">
            <div id="title-content">
                <div class="crisis-title">アキエクライシス</div>
                <div id="best-info-container">
                    最高記録: <span id="best-score-text">0</span> 点<br>
                    <span id="best-shogo-text">いちげんさん</span>
                </div>
                <button class="action-btn" onpointerdown="startGame()">宴開始</button>
                <button class="action-btn secondary-btn" onpointerdown="showHowTo()">遊び方</button>
            </div>
            <div id="result-area" style="display:none;"></div>
            <button id="return-btn-id" class="action-btn" style="display:none;" onpointerdown="resetMenu()">おあいそ</button>
        </div>

        <div id="how-to-play-screen" class="overlay" style="display:none;">
            <h2 style="color: #ffcc00; margin-top: 0;">宴のルール</h2>
            <div style="font-size: 14px; line-height: 1.6; color: #eee; width: 100%;">
                <p>● 左右ボタンで移動してモツを喰らえ！</p>
                <p>● 10個食べると体力回復！</p>
                <p>● 14個で梅割り抽選！</p>
                <p>● 10000点突破で伝説(レジェンド)へ</p>
            </div>
            <button class="action-btn" style="width:150px;" onpointerdown="hideHowTo()">閉じる</button>
        </div>

        <div id="ui-layer">
            <div id="hp-display">体力: ❤️❤️❤️</div>
            <div id="score-board">0点</div>
            <div id="combo-display">コンボ: 0</div>
        </div>
        <div id="player"></div>
    </div>

    <div id="controls">
        <button class="btn" onpointerdown="moveLeft()">◀</button>
        <button class="btn" onpointerdown="moveRight()">▶</button>
    </div>

    <script>
        const totalLines = 5;
        const lineWidth = 360 / totalLines;
        const screen = document.getElementById('game-screen');
        const flash = document.getElementById('damage-flash');
        const player = document.getElementById('player');
        const titleScreen = document.getElementById('title-screen');
        const titleContent = document.getElementById('title-content');
        const resultArea = document.getElementById('result-area');
        const returnBtn = document.getElementById('return-btn-id');
        const scoreDisplay = document.getElementById('score-board');
        const hpDisplay = document.getElementById('hp-display');
        const comboDisplay = document.getElementById('combo-display');
        const bgDangerLayer = document.getElementById('bg-danger');

        const sounds = {
            bgm: new Audio('./audio/bgm.mp3'),
            move: new Audio('./audio/move.mp3'),
            damage: new Audio('./audio/damage.mp3'),
            siren: new Audio('./audio/siren.mp3'),
            heal: new Audio('./audio/heal.mp3'),
            get: new Audio('./audio/get.mp3')
        };
        sounds.bgm.loop = true;
        sounds.siren.loop = true;

        let score, hp, combo, playerLine, isGameRunning = false;
        let spawnInterval, bgInterval, charInterval, confettiInterval;
        let lastLine = -1, baseFallSpeed = 1.3, autoHealCounter = 0, umewariLotteryCounter = 0, currentPlayerImgIdx = 1;
        let charProbBase = 0.10, lastBgIdx = 0, lastSwitchTime = 0, currentSpawnRate = 1400;

        const motsuScore = [
            { img: './images/shiro.png', type: 'score' }, { img: './images/hatsu.png', type: 'score' },
            { img: './images/lever.png', type: 'score' }, { img: './images/abura.png', type: 'score' },
            { img: './images/kasira.png', type: 'score' }
        ];
        const motsuDanger = [
            { img: './images/gatsu.png', type: 'damage' }, { img: './images/nankotsu.png', type: 'damage' }
        ];

        function getShogo(s) {
            if (s >= 10000) return { text: "レジェンド", class: "shogo-legend" };
            if (s >= 3001) return { text: "常連さん", class: "" };
            if (s >= 1000) return { text: "お客さん", class: "" };
            if (s >= 500) return { text: "御新規さん", class: "" };
            return { text: "いちげんさん", class: "" };
        }

        function updateBestDisplay() {
            const bestScore = parseInt(localStorage.getItem('akie_best_score') || '0');
            const bestShogo = getShogo(bestScore);
            document.getElementById('best-score-text').innerText = bestScore;
            const shogoDisp = document.getElementById('best-shogo-text');
            shogoDisp.innerText = bestShogo.text;
            shogoDisp.className = bestShogo.class;
        }

        window.onload = updateBestDisplay;

        function showHowTo() { document.getElementById('how-to-play-screen').style.display = 'flex'; }
        function hideHowTo() { document.getElementById('how-to-play-screen').style.display = 'none'; }

        async function startGame() {
            if (isGameRunning) return;
            isGameRunning = true;

            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') await ctx.resume();
                for (let k in sounds) {
                    sounds[k].muted = true;
                    await sounds[k].play().then(() => { sounds[k].pause(); sounds[k].muted = false; sounds[k].currentTime = 0; }).catch(()=>{});
                }
                sounds.bgm.playbackRate = 1.0; 
                await sounds.bgm.play();
            } catch (e) {}

            // 変数初期化
            score = 0; hp = 3; combo = 0; playerLine = 2; 
            baseFallSpeed = 1.3; autoHealCounter = 0; umewariLotteryCounter = 0; 
            charProbBase = 0.10; currentSpawnRate = 1400;

            titleScreen.style.display = 'none';
            resultArea.style.display = 'none';
            returnBtn.style.display = 'none';
            bgDangerLayer.classList.remove('danger-active');
            updateUI();
            updatePlayerPos(false);
            
            lastSwitchTime = Date.now();
            if (bgInterval) clearInterval(bgInterval);
            bgInterval = setInterval(() => {
                const now = Date.now();
                if (now - lastSwitchTime >= 30000) {
                    const bgs = document.querySelectorAll('.bg-layer');
                    let nextIdx; do { nextIdx = Math.floor(Math.random() * bgs.length); } while (nextIdx === lastBgIdx);
                    bgs.forEach(b => b.classList.remove('bg-active'));
                    bgs[nextIdx].classList.add('bg-active');
                    lastBgIdx = nextIdx; lastSwitchTime = now;
                }
            }, 500);

            if (charInterval) clearInterval(charInterval);
            charInterval = setInterval(() => {
                if (!isGameRunning) return;
                if (score >= 1000) { charProbBase = Math.min(charProbBase + 0.01, 0.85); }
                let newRate = 1400;
                if (score >= 10000) newRate = 500;
                else if (score >= 5000) newRate = 700;
                else if (score >= 3000) newRate = 1000;
                if (newRate !== currentSpawnRate) {
                    currentSpawnRate = newRate;
                    clearInterval(spawnInterval);
                    spawnInterval = setInterval(spawnMotsu, currentSpawnRate);
                }
            }, 1000);

            if (spawnInterval) clearInterval(spawnInterval);
            spawnInterval = setInterval(spawnMotsu, currentSpawnRate);
        }

        function gameOver() {
            if (!isGameRunning) return;
            isGameRunning = false;
            clearInterval(spawnInterval);
            clearInterval(bgInterval);
            clearInterval(charInterval);
            
            sounds.bgm.pause();
            sounds.siren.pause();
            sounds.damage.play();
            player.classList.add('shivering');
            flash.style.opacity = "0.7"; setTimeout(() => flash.style.opacity = "0", 150);
            
            const bestScore = parseInt(localStorage.getItem('akie_best_score') || '0');
            if (score > bestScore) { localStorage.setItem('akie_best_score', score.toString()); }

            const shogoData = getShogo(score);
            setTimeout(() => {
                document.querySelectorAll('.motsu').forEach(m => m.remove());
                titleScreen.style.display = 'flex';
                titleContent.style.display = 'none';
                resultArea.innerHTML = `<div class="denpyo"><h2>御計算書</h2><div class="denpyo-row"><span>好きなモツ</span><span>込</span></div><div class="denpyo-row"><span>梅割り（酒）</span><span>込</span></div><div class="total-row"><span>合計</span><span>${score} 点</span></div><div class="shogo-stamp ${shogoData.class}">${shogoData.text}</div></div>`;
                resultArea.style.display = 'block';
                returnBtn.style.display = 'block';
                if (score >= 10000) {
                    returnBtn.innerText = "ごちそうさま";
                    createConfetti();
                    confettiInterval = setInterval(createConfetti, 2500);
                } else {
                    returnBtn.innerText = "おあいそ";
                }
            }, 600);
        }

        function resetMenu() { 
            clearInterval(confettiInterval);
            document.querySelectorAll('.confetti').forEach(c => c.remove());
            updateBestDisplay();
            resultArea.style.display = 'none';
            returnBtn.style.display = 'none';
            titleContent.style.display = 'block';
            player.classList.remove('shivering'); 
            player.style.backgroundImage = "url('./images/player1.png')";
            scoreDisplay.innerText = "0点";
            hpDisplay.innerText = "体力: ❤️❤️❤️";
            comboDisplay.innerText = "コンボ: 0";
        }

        function updateUI() {
            hpDisplay.innerText = "体力: " + "❤️".repeat(Math.max(0, hp));
            scoreDisplay.innerText = score + "点";
            comboDisplay.innerText = "コンボ: " + combo;
            if (hp === 1 && isGameRunning) { 
                bgDangerLayer.classList.add('danger-active'); 
                if (sounds.siren.paused) sounds.siren.play(); 
            } else { 
                bgDangerLayer.classList.remove('danger-active'); 
                sounds.siren.pause(); 
            }
        }

        function updatePlayerPos(s = true) {
            player.style.left = (playerLine * lineWidth + (lineWidth - 70)/2) + 'px';
            if (s) { 
                currentPlayerImgIdx = (currentPlayerImgIdx === 1) ? 2 : 1; 
                player.style.backgroundImage = `url('./images/player${currentPlayerImgIdx}.png')`; 
                sounds.move.currentTime = 0; 
                sounds.move.play(); 
            }
        }

        window.moveLeft = () => { if(playerLine > 0 && isGameRunning) { playerLine--; updatePlayerPos(); } };
        window.moveRight = () => { if(playerLine < totalLines - 1 && isGameRunning) { playerLine++; updatePlayerPos(); } };

        function spawnMotsu() {
            if (!isGameRunning) return;
            let line; do { line = Math.floor(Math.random() * totalLines); } while (line === lastLine);
            lastLine = line;
            
            const motsu = document.createElement('div');
            let dangerProb = 0.28;
            if (score >= 10000) dangerProb = 0.70;
            else if (score >= 5000) dangerProb = 0.60;
            else if (score >= 3000) dangerProb = 0.45;
            else dangerProb += Math.min(score / 10000, 0.12);

            let data; 
            let currentFallSpeed = baseFallSpeed;
            if (umewariLotteryCounter >= 14 && Math.random() < 0.25) {
                umewariLotteryCounter = 0; data = { img: './images/umewari.png', type: 'item' }; motsu.classList.add('item-umewari');
            } else if (Math.random() < dangerProb) {
                data = motsuDanger[Math.floor(Math.random() * motsuDanger.length)];
                if (Math.random() < charProbBase) { currentFallSpeed *= 3.0; motsu.classList.add('char-mode'); }
            } else { 
                data = motsuScore[Math.floor(Math.random() * motsuScore.length)]; 
            }
            
            motsu.className = 'motsu'; 
            motsu.style.backgroundImage = `url('${data.img}')`;
            motsu.style.left = (line * lineWidth + (lineWidth - 60)/2) + 'px'; 
            motsu.style.top = '-70px'; 
            screen.appendChild(motsu);
            
            baseFallSpeed += 0.005;
            
            let top = -70;
            function fall() {
                if (!isGameRunning) { motsu.remove(); return; }
                top += currentFallSpeed; 
                motsu.style.top = top + 'px';
                if (top > 380 && top < 450 && line === playerLine) { handleColl(data); motsu.remove(); return; }
                if (top > 500) { motsu.remove(); return; }
                requestAnimationFrame(fall);
            }
            requestAnimationFrame(fall);
        }

        function handleColl(d) {
            if (!isGameRunning) return;
            if (d.type === 'damage') {
                hp--; combo = 0; sounds.damage.play();
                flash.style.opacity = "0.7"; setTimeout(() => flash.style.opacity = "0", 150);
                if (hp <= 0) gameOver();
            } else if (d.type === 'item') {
                if (hp >= 3) { score += 100; sounds.get.play(); } else { hp++; sounds.heal.play(); }
            } else {
                combo++; score += 10; autoHealCounter++; umewariLotteryCounter++;
                sounds.get.currentTime = 0; sounds.get.play();
                if (autoHealCounter >= 10) { autoHealCounter = 0; if (hp < 3) { hp++; sounds.heal.play(); } else { score += 100; } }
            }
            updateUI();
        }

        function createConfetti() {
            if (resultArea.style.display === 'none') return;
            const colors = ['#f00', '#0f0', '#00f', '#ff0', '#f0f', '#0ff', '#fff'];
            for(let i=0; i<30; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
                c.style.left = Math.random() * 100 + '%';
                c.style.top = '-10px';
                titleScreen.appendChild(c);
                let top = -10, left = parseFloat(c.style.left), speed = 2 + Math.random() * 4, drift = (Math.random() - 0.5) * 2;
                function fall() {
                    if (resultArea.style.display === 'none') { c.remove(); return; }
                    top += speed; left += drift; c.style.top = top + 'px'; c.style.left = left + '%';
                    if(top < 500) requestAnimationFrame(fall); else c.remove();
                }
                requestAnimationFrame(fall);
            }
        }
    </script>
</body>
</html>
