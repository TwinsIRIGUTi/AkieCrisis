<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>一本歯のモツパクゲーム - テスト版</title>
    <style>
        body { 
            background: #222; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            font-family: 'Courier New', Courier, monospace;
            color: white; 
            touch-action: manipulation; /* ダブルタップズーム防止 */
        }

        /* ゲーム画面（5ライン想定: 幅400px） */
        #game-screen { 
            position: relative; 
            width: 400px; 
            height: 550px; 
            background: #eee; 
            border: 5px solid #000; 
            overflow: hidden; 
        }
        
        /* プレイヤー（一本歯ドット絵） */
        #player {
            position: absolute;
            bottom: 10px;
            width: 80px;  /* 1ラインの幅 */
            height: 80px;
            /* GitHubのフォルダ構成に合わせる */
            background-image: url('images/player.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent;
            transition: left 0.05s ease-out; /* 素早い移動 */
            z-index: 10;
        }

        /* 落ちてくるモツ（仮の丸型） */
        .motsu {
            position: absolute;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            border-radius: 50%;
            border: 2px solid #000;
            text-shadow: 1px 1px 0 #000;
        }

        /* スコア表示 */
        #score-board {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #333;
            font-size: 24px;
            font-weight: bold;
        }

        /* 操作ボタン */
        #controls { 
            margin-top: 20px; 
            display: flex; 
            gap: 50px; 
        }
        .btn { 
            width: 100px;
            height: 60px;
            font-size: 30px; 
            cursor: pointer; 
            background: #e74c3c; 
            color: white; 
            border: none; 
            border-bottom: 5px solid #c0392b;
            border-radius: 10px;
            font-weight: bold;
        }
        .btn:active {
            border-bottom: 0;
            transform: translateY(5px);
        }
    </style>
</head>
<body>

    <div id="game-screen">
        <div id="score-board">0</div>
        <div id="player"></div>
    </div>

    <div id="controls">
        <button class="btn" id="left-btn">◀</button>
        <button class="btn" id="right-btn">▶</button>
    </div>

    <script>
        const screen = document.getElementById('game-screen');
        const player = document.getElementById('player');
        const scoreDisplay = document.getElementById('score-board');
        
        let score = 0;
        let playerLine = 2; // 初期位置（中央：0,1,2,3,4）
        const totalLines = 5;
        const lineWidth = 80; // 400px / 5line

        // モツのデータ
        const motsuList = [
            { name: 'ハツ', color: '#a04040' },
            { name: 'レバ', color: '#602020' },
            { name: 'ナンコツ', color: '#d2b48c' },
            { name: 'ガツ', color: '#f5deb3' },
            { name: 'シロ', color: '#ffffff' },
            { name: 'カシラ', color: '#8b4513' }
        ];

        // プレイヤーの位置を更新
        function updatePosition() {
            player.style.left = (playerLine * lineWidth) + 'px';
        }
        updatePosition(); // 初回配置

        // 移動処理
        function moveLeft() { if (playerLine > 0) playerLine--; updatePosition(); }
        function moveRight() { if (playerLine < totalLines - 1) playerLine++; updatePosition(); }

        // ボタンイベント
        document.getElementById('left-btn').addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft(); });
        document.getElementById('left-btn').addEventListener('click', moveLeft);
        
        document.getElementById('right-btn').addEventListener('touchstart', (e) => { e.preventDefault(); moveRight(); });
        document.getElementById('right-btn').addEventListener('click', moveRight);

        // キーボード操作
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') moveLeft();
            if (e.key === 'ArrowRight') moveRight();
        });

        // モツ生成
        function spawnMotsu() {
            const motsu = document.createElement('div');
            const type = motsuList[Math.floor(Math.random() * motsuList.length)];
            const line = Math.floor(Math.random() * totalLines);
            
            motsu.className = 'motsu';
            motsu.innerText = type.name;
            motsu.style.backgroundColor = type.color;
            motsu.style.left = (line * lineWidth + 15) + 'px'; // 中央寄せ
            motsu.style.top = '-60px';
            
            screen.appendChild(motsu);

            let currentTop = -60;
            const fallSpeed = 4 + Math.random() * 3; // 落下速度のばらつき

            function fall() {
                currentTop += fallSpeed;
                motsu.style.top = currentTop + 'px';

                // 当たり判定 (プレイヤーの頭付近に到達)
                if (currentTop > 430 && currentTop < 490 && line === playerLine) {
                    score += 10;
                    scoreDisplay.innerText = score;
                    motsu.remove();
                    return;
                }

                // 画面外へ
                if (currentTop > 550) {
                    motsu.remove();
                    return;
                }

                requestAnimationFrame(fall);
            }
            requestAnimationFrame(fall);
        }

        // 1.2秒おきにモツを降らせる
        setInterval(spawnMotsu, 1200);

    </script>
</body>
</html>
