<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>一本歯のモツパクゲーム - シロ追加版</title>
    <style>
        body { 
            background: #222; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            font-family: sans-serif;
            color: white; 
            touch-action: manipulation;
        }

        /* ゲーム画面（空の色に変更） */
        #game-screen { 
            position: relative; 
            width: 400px; 
            height: 600px; 
            background: #87CEEB; /* スカイブルー */
            border: 5px solid #333; 
            overflow: hidden; 
        }
        
        /* プレイヤー（一本歯キャラクター） */
        #player {
            position: absolute;
            bottom: 20px;
            width: 80px; 
            height: 80px;
            background-image: url('images/player.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            /* 画像がない時のための仮の姿（ピンクの枠） */
            border: 2px dashed #ff69b4;
            transition: left 0.1s ease-out;
            z-index: 100; /* 最前面に */
        }

        /* 落ちてくるシロ */
        .motsu {
            position: absolute;
            width: 70px;
            height: 70px;
            background-image: url('images/shiro.png'); /* シロの画像 */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            /* 画像がない時のための色（白） */
            background-color: rgba(255,255,255,0.3);
            border-radius: 10px;
        }

        #score-board {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 200;
        }

        #controls { margin-top: 20px; display: flex; gap: 40px; }
        .btn { 
            width: 100px; height: 70px; font-size: 30px; 
            background: #ffcc00; border: none; 
            border-bottom: 5px solid #ccaa00; border-radius: 15px;
        }
    </style>
</head>
<body>

    <div id="game-screen">
        <div id="score-board">SCORE: 0</div>
        <div id="player"></div>
    </div>

    <div id="controls">
        <button class="btn" id="left-btn">◀</button>
        <button class="btn" id="right-btn">▶</button>
    </div>

    <script>
        const screen = document.getElementById('game-screen');
        const player = document.getElementById('player');
        const scoreDisplay = document.getElementById('score-board');
        
        let score = 0;
        let playerLine = 2; 
        const totalLines = 5;
        const lineWidth = 80;

        function updatePosition() {
            player.style.left = (playerLine * lineWidth) + 'px';
        }
        updatePosition();

        function moveLeft() { if (playerLine > 0) playerLine--; updatePosition(); }
        function moveRight() { if (playerLine < totalLines - 1) playerLine++; updatePosition(); }

        document.getElementById('left-btn').onclick = moveLeft;
        document.getElementById('right-btn').onclick = moveRight;
        window.onkeydown = (e) => {
            if (e.key === 'ArrowLeft') moveLeft();
            if (e.key === 'ArrowRight') moveRight();
        };

        function spawnMotsu() {
            const motsu = document.createElement('div');
            const line = Math.floor(Math.random() * totalLines);
            
            motsu.className = 'motsu';
            motsu.style.left = (line * lineWidth + 5) + 'px';
            motsu.style.top = '-80px';
            screen.appendChild(motsu);

            let currentTop = -80;
            // 落下速度をかなり遅く設定（1〜2px程度）
            const fallSpeed = 1.5 + Math.random() * 1.5; 

            function fall() {
                currentTop += fallSpeed;
                motsu.style.top = currentTop + 'px';

                // 当たり判定
                if (currentTop > 450 && currentTop < 520 && line === playerLine) {
                    score += 10;
                    scoreDisplay.innerText = "SCORE: " + score;
                    motsu.remove();
                    return;
                }

                if (currentTop > 600) {
                    motsu.remove();
                    return;
                }
                requestAnimationFrame(fall);
            }
            requestAnimationFrame(fall);
        }

        // 生成間隔も少しゆったり（2秒に1回）
        setInterval(spawnMotsu, 2000);
    </script>
</body>
</html>
