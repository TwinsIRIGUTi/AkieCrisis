<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>アキエクライシス - BGM実装版</title>
    <style>
        body { background: #1a0000; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; overflow: hidden; touch-action: none; font-family: 'Hiragino Kaku Gothic ProN', sans-serif; }
        #game-screen { 
            position: relative; width: 360px; height: 500px; 
            background-color: #222; background-image: url('./images/background.png'); 
            background-size: cover; background-position: center;
            border: 4px solid #440000; margin-top: 10px; overflow: hidden; border-radius: 10px; 
        }
        #damage-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: red; opacity: 0; pointer-events: none; z-index: 50; transition: opacity 0.1s; }
        .crisis-title { font-size: 42px; font-weight: 900; color: #fff; text-shadow: 0 0 10px #ff0000, 3px 3px 0 #880000; letter-spacing: 2px; margin: 10px 0; font-style: italic; text-align: center; }
        #player { position: absolute; bottom: 10px; width: 70px; height: 70px; background-size: contain; background-repeat: no-repeat; background-position: center; z-index: 10; transition: left 0.1s ease-out; }
        .motsu { position: absolute; width: 60px; height: 60px; background-size: contain; background-repeat: no-repeat; background-position: center; z-index: 5; animation: puripuri 1s infinite; }
        .item-umewari { filter: drop-shadow(0 0 12px #ff00ff) brightness(1.2); z-index: 6 !important; }
        @keyframes puripuri { 0%, 49% { transform: scaleX(1); } 50%, 100% { transform: scaleX(-1); } }
        @keyframes shiver { 0% { transform: translate(0, 0); } 25% { transform: translate(2px, -2px); } 50% { transform: translate(-2px, 2px); } 75% { transform: translate(2px, 2px); } 100% { transform: translate(0, 0); } }
        .shivering { animation: shiver 0.1s infinite !important; }
        #ui-layer { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-around; color: white; font-weight: bold; text-shadow: 2px 2px #000; z-index: 20; pointer-events: none; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 10px; box-sizing: border-box; }
        .instruction { font-size: 13px; color: #ccc; margin: 5px 0; text-align: center; line-height: 1.6; }
        .enemy-box { display: flex; gap: 15px; background: rgba(255,0,0,0.2); padding: 10px; border-radius: 8px; border: 1px solid #ff4444; margin: 10px 0; }
        .enemy-item { text-align: center; font-size: 11px; }
        .enemy-img { width: 40px; height: 40px; background-size: contain; background-repeat: no-repeat; margin-bottom: 5px; }
        .ranking-list { list-style: none; padding: 0; text-align: center; color: #ffcc00; font-size: 16px; margin: 5px 0; }
        .action-btn { padding: 12px 30px; font-size: 22px; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .start-btn { background: #aa0000; border-bottom: 5px solid #660000; }
        .return-btn { background: #444; display: none; }
        #controls { display: flex; gap: 30px; margin-top: 15px; }
        .btn { width: 120px; height: 80px; font-size: 40px; color: white; background: #880000; border: none; border-bottom: 6px solid #440000; border-radius: 20px; }
    </style>
</head>
<body>

    <div id="game-screen">
        <div id="damage-flash"></div>
        <div id="title-screen" class="overlay">
            <div class="crisis-title">アキエクライシス</div>
            <p class="instruction">
                10個食べれば体力全快！？<br>
                <span style="color: #ff00ff; font-weight: bold; font-size: 16px;">梅割り呑んで回復だ！！</span>
            </p>
            <div class="enemy-box">
                <div class="enemy-item">
                    <div class="enemy-img" style="background-image: url('./images/gatsu.png');"></div>
                    <div>ガツ</div>
                </div>
                <div class="enemy-item">
                    <div class="enemy-img" style="background-image: url('./images/nankotsu.png');"></div>
                    <div>ナンコツ</div>
                </div>
                <div style="font-size: 14px; color: #ff4444; align-self: center; font-weight: bold;">危険！<br>おなかこわす</div>
            </div>
            <div id="result-area"></div>
            <p id="ranking-title">🏆 ハイスコア 🏆</p>
            <ul id="ranking-display" class="ranking-list"></ul>
            <button id="start-btn-id" class="action-btn start-btn" onclick="startGame()">サバイバル開始</button>
            <button id="return-btn-id" class="action-btn return-btn" onclick="resetMenu()">タイトルへ戻る</button>
        </div>
        <div id="ui-layer">
            <div id="hp-display">体力: ❤️❤️❤️</div>
            <div id="score-board">0点</div>
            <div id="combo-display">コンボ: 0</div>
        </div>
        <div id="player"></div>
    </div>

    <div id="controls">
        <button class="btn" onclick="moveLeft()">◀</button>
        <button class="btn" onclick="moveRight()">▶</button>
    </div>

    <script>
        const screen = document.getElementById('game-screen');
        const flash = document.getElementById('damage-flash');
        const player = document.getElementById('player');
        const scoreDisplay = document.getElementById('score-board');
        const hpDisplay = document.getElementById('hp-display');
        const comboDisplay = document.getElementById('combo-display');
        const titleScreen = document.getElementById('title-screen');
        const startBtn = document.getElementById('start-btn-id');
        const returnBtn = document.getElementById('return-btn-id');

        // 音源
        const sndBgm = new Audio('./audio/bgm.mp3'); // BGM
        const sndMove = new Audio('./audio/move.mp3');
        const sndDamage = new Audio('./audio/damage.mp3');
        const sndSiren = new Audio('./audio/siren.mp3');
        const sndHeal = new Audio('./audio/heal.mp3');
        
        sndBgm.loop = true; // BGMループ有効
        sndSiren.loop = true;

        let score, hp, combo, playerLine, isGameRunning = false, spawnInterval;
        let lastLine = -1;
        let baseFallSpeed = 1.3;
        let autoHealCounter = 0;
        let umewariLotteryCounter = 0;
        let currentPlayerImgIdx = 1;
        
        const AUTO_HEAL_TRIGGER = 10;
        const UMEWARI_LOTTERY_TRIGGER = 14;
        const UMEWARI_PROBABILITY = 0.25;

        const totalLines = 5;
        const lineWidth = 360 / totalLines;
        const motsuTypes = [
            { name: 'シロ', img: './images/shiro.png', type: 'score' },
            { name: 'ハツ', img: './images/hatsu.png', type: 'score' },
            { name: 'レバー', img: './images/lever.png', type: 'score' },
            { name: 'アブラ', img: './images/abura.png', type: 'score' },
            { name: 'カシラ', img: './images/kasira.png', type: 'score' },
            { name: 'ガツ', img: './images/gatsu.png', type: 'damage' },
            { name: 'ナンコツ', img: './images/nankotsu.png', type: 'damage' }
        ];
        const itemUmewari = { name: '梅割り', img: './images/umewari.png', type: 'item' };

        window.onload = updateRankingDisplay;

        function updateRankingDisplay() {
            const scores = JSON.parse(localStorage.getItem('motsuHighScores')) || [0, 0, 0];
            document.getElementById('ranking-display').innerHTML = scores.map((s, i) => `<li>${i+1}位: ${s}点</li>`).join('');
        }

        function startGame() {
            // 全音源の再生制限を解除
            [sndBgm, sndMove, sndDamage, sndSiren, sndHeal].forEach(s => { 
                s.play().then(() => { s.pause(); s.currentTime = 0; }).catch(() => {}); 
            });

            score = 0; hp = 3; combo = 0; playerLine = 2; baseFallSpeed = 1.3; 
            autoHealCounter = 0; umewariLotteryCounter = 0;
            isGameRunning = true;
            titleScreen.style.display = 'none';
            player.classList.remove('shivering');
            currentPlayerImgIdx = 1;
            player.style.backgroundImage = "url('./images/player1.png')";
            
            // BGM開始
            sndBgm.currentTime = 0;
            sndBgm.playbackRate = 1.0; // 速度を等倍に戻す
            sndBgm.play().catch(e => console.log("BGM再生失敗:", e));

            updateUI();
            updatePlayerPos(false);
            spawnInterval = setInterval(spawnMotsu, 1400);
        }

        function triggerFlash(color, duration = 100) {
            flash.style.backgroundColor = color;
            flash.style.opacity = "0.7";
            setTimeout(() => { flash.style.opacity = "0"; }, duration);
        }

        function gameOver() {
            if (!isGameRunning) return;
            isGameRunning = false;
            clearInterval(spawnInterval);
            
            sndBgm.pause(); // BGM停止
            sndSiren.pause();
            sndDamage.play();
            
            player.classList.add('shivering');
            triggerFlash("red", 600);
            setTimeout(() => {
                saveScore(score);
                updateRankingDisplay();
                titleScreen.style.display = 'flex';
                document.getElementById('result-area').innerHTML = `<h2 style="color:red; margin:5px;">おなかをこわした！！</h2><p style="font-size:20px;">記録: ${score}点</p>`;
                startBtn.style.display = 'none';
                returnBtn.style.display = 'block';
                document.querySelector('.enemy-box').style.display = 'none';
                document.querySelectorAll('.instruction').forEach(el => el.style.display = 'none');
                document.getElementById('ranking-title').style.display = 'none';
                document.getElementById('ranking-display').style.display = 'none';
            }, 600);
        }

        function saveScore(newScore) {
            let scores = JSON.parse(localStorage.getItem('motsuHighScores')) || [0, 0, 0];
            scores.push(newScore);
            scores.sort((a, b) => b - a);
            localStorage.setItem('motsuHighScores', JSON.stringify(scores.slice(0, 3)));
        }

        function resetMenu() {
            document.getElementById('result-area').innerHTML = "";
            startBtn.style.display = 'block';
            returnBtn.style.display = 'none';
            document.querySelector('.enemy-box').style.display = 'flex';
            document.querySelectorAll('.instruction').forEach(el => el.style.display = 'block');
            document.getElementById('ranking-title').style.display = 'block';
            document.getElementById('ranking-display').style.display = 'block';
            updateRankingDisplay();
        }

        function updateUI() {
            hpDisplay.innerText = "体力: " + "❤️".repeat(Math.max(0, hp));
            scoreDisplay.innerText = score + "点";
            comboDisplay.innerText = "コンボ: " + combo;
            if (hp === 1 && isGameRunning) { if (sndSiren.paused) sndSiren.play().catch(() => {}); } else { sndSiren.pause(); }
        }

        function updatePlayerPos(playSound = true) {
            player.style.left = (playerLine * lineWidth + (lineWidth - 70)/2) + 'px';
            if (playSound) { 
                currentPlayerImgIdx = (currentPlayerImgIdx === 1) ? 2 : 1;
                player.style.backgroundImage = `url('./images/player${currentPlayerImgIdx}.png')`;
                sndMove.currentTime = 0; 
                sndMove.play().catch(() => {}); 
            }
        }

        window.moveLeft = () => { if(playerLine > 0 && isGameRunning) { playerLine--; updatePlayerPos(); } };
        window.moveRight = () => { if(playerLine < totalLines - 1 && isGameRunning) { playerLine++; updatePlayerPos(); } };

        function spawnMotsu() {
            if (!isGameRunning) return;
            let line;
            do { line = Math.floor(Math.random() * totalLines); } while (line === lastLine);
            lastLine = line;

            const motsu = document.createElement('div');
            let data;

            if (umewariLotteryCounter >= UMEWARI_LOTTERY_TRIGGER) {
                umewariLotteryCounter = 0;
                if (Math.random() < UMEWARI_PROBABILITY) {
                    data = itemUmewari;
                    motsu.classList.add('item-umewari');
                } else {
                    data = motsuTypes[Math.floor(Math.random() * motsuTypes.length)];
                }
            } else {
                data = motsuTypes[Math.floor(Math.random() * motsuTypes.length)];
            }

            motsu.className += ' motsu';
            motsu.style.backgroundImage = `url('${data.img}')`;
            motsu.style.left = (line * lineWidth + (lineWidth - 60)/2) + 'px';
            motsu.style.top = '-70px';
            screen.appendChild(motsu);

            // 加速システム
            baseFallSpeed += 0.005;
            
            // BGMの速度も連動（最高2倍速まで）
            if (sndBgm.playbackRate < 2.0) {
                sndBgm.playbackRate = 1.0 + (baseFallSpeed - 1.3) * 0.2;
            }

            let top = -70;
            function fall() {
                if (!isGameRunning) { motsu.remove(); return; }
                top += baseFallSpeed;
                motsu.style.top = top + 'px';
                if (top > 380 && top < 450 && line === playerLine) {
                    if (data.type === 'damage') {
                        hp--; combo = 0; 
                        sndDamage.currentTime = 0; sndDamage.play().catch(() => {});
                        triggerFlash("red", 150);
                        if (hp <= 0) gameOver();
                    } else if (data.type === 'item') {
                        if (hp < 3) hp++;
                        sndHeal.play().catch(() => {});
                        triggerFlash("white", 200);
                    } else {
                        combo++; score += 10;
                        autoHealCounter++;
                        umewariLotteryCounter++;
                        if (autoHealCounter >= AUTO_HEAL_TRIGGER) {
                            autoHealCounter = 0;
                            if (hp < 3) {
                                hp++;
                                sndHeal.play().catch(() => {});
                                triggerFlash("white", 200);
                            }
                        }
                    }
                    updateUI();
                    motsu.remove();
                    return;
                }
                if (top > 500) { motsu.remove(); return; }
                requestAnimationFrame(fall);
            }
            requestAnimationFrame(fall);
        }
    </script>
</body>
</html>
