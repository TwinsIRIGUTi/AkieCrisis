<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>アキエクライシス - 混沌の宴</title>
    <style>
        body { 
            background: #1a0000; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; overflow: hidden; touch-action: none; font-family: sans-serif;
            -webkit-user-select: none; user-select: none;
        }
        #game-screen { 
            position: relative; width: 360px; height: 500px; 
            background: #222; border: 4px solid #440000; margin-top: 10px; overflow: hidden; border-radius: 10px; 
        }
        /* 背景レイヤー（6種類） */
        .bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s; z-index: 1; }
        .bg-active { opacity: 1; }
        
        #bg-danger { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('./images/background_danger.png'); background-size: cover; background-position: center; opacity: 0; transition: opacity 0.5s; z-index: 2; pointer-events: none; }
        .danger-active { opacity: 1 !important; }

        #damage-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: red; opacity: 0; pointer-events: none; z-index: 50; }
        #player { position: absolute; bottom: 10px; width: 70px; height: 70px; background-image: url('./images/player1.png'); background-size: contain; background-repeat: no-repeat; background-position: center; z-index: 10; will-change: left; }
        
        .motsu { position: absolute; width: 60px; height: 60px; background-size: contain; background-repeat: no-repeat; background-position: center; z-index: 5; animation: puripuri 1s infinite; will-change: top; }
        
        .char-mode { 
            filter: drop-shadow(0 0 15px #ff0000) brightness(1.2) contrast(1.5); 
            animation: puripuri 0.2s infinite !important;
            z-index: 7 !important;
        }

        .item-umewari { filter: drop-shadow(0 0 12px #ff00ff); z-index: 6 !important; }
        .crisis-title { font-size: 38px; font-weight: 900; color: #fff; text-shadow: 0 0 10px #ff0000, 3px 3px 0 #880000; margin: 5px 0; font-style: italic; text-align: center; white-space: nowrap; width: 100%; }
        @keyframes puripuri { 0%, 49% { transform: scaleX(1); } 50%, 100% { transform: scaleX(-1); } }
        @keyframes shiver { 0% { transform: translate(0, 0); } 25% { transform: translate(1px, -1px); } 50% { transform: translate(-1px, 1px); } 100% { transform: translate(0, 0); } }
        .shivering { animation: shiver 0.1s infinite !important; }

        #ui-layer { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-around; color: white; font-weight: bold; text-shadow: 2px 2px #000; z-index: 20; pointer-events: none; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 10px; box-sizing: border-box; }
        .instruction { font-size: 12px; color: #ccc; margin: 3px 0; text-align: center; }
        .motsu-info-container { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; align-items: center; width: 100%; }
        .motsu-row { display: flex; gap: 8px; background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 5px; align-items: center; justify-content: space-between; min-width: 240px; }
        .motsu-row.danger { background: rgba(255,0,0,0.2); border: 1px solid #ff4444; }
        .mini-img { width: 30px; height: 30px; background-size: contain; background-repeat: no-repeat; }
        
        .action-btn { 
            padding: 12px 40px; font-size: 24px; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; background: #aa0000; border-bottom: 5px solid #660000;
            width: 220px; text-align: center; margin-top: 10px;
        }
        .return-btn { background: #444; border-bottom: 5px solid #222; display: none; }

        #controls { display: flex; gap: 30px; margin-top: 15px; }
        .btn { 
            width: 120px; height: 80px; font-size: 40px; color: white; background: #880000; border: none; border-bottom: 6px solid #440000; border-radius: 20px; 
            -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; cursor: pointer;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="game-screen">
        <div id="bg0" class="bg-layer bg-active" style="background-image: url('./images/background1.png');"></div>
        <div id="bg1" class="bg-layer" style="background-image: url('./images/background2.png');"></div>
        <div id="bg2" class="bg-layer" style="background-image: url('./images/background3.png');"></div>
        <div id="bg3" class="bg-layer" style="background-image: url('./images/background4.png');"></div>
        <div id="bg4" class="bg-layer" style="background-image: url('./images/background5.png');"></div>
        <div id="bg5" class="bg-layer" style="background-image: url('./images/background6.png');"></div>
        <div id="bg-danger"></div>

        <div id="damage-flash"></div>
        <div id="title-screen" class="overlay">
            <div class="crisis-title">アキエクライシス</div>
            <p class="instruction">10個で体力1回復 / 14個で「梅割り」抽選<br><span style="color: #ff00ff; font-weight: bold;">梅割り呑んで回復だ！！</span></p>
            <div class="motsu-info-container">
                <div class="motsu-row">
                    <div style="display:flex; gap:5px;"><div class="mini-img" style="background-image: url('./images/shiro.png');"></div><div class="mini-img" style="background-image: url('./images/hatsu.png');"></div><div class="mini-img" style="background-image: url('./images/lever.png');"></div><div class="mini-img" style="background-image: url('./images/abura.png');"></div><div class="mini-img" style="background-image: url('./images/kasira.png');"></div></div>
                </div>
                <div class="motsu-row danger">
                    <div style="display:flex; gap:12px; margin-left: 10px;"><div class="mini-img" style="background-image: url('./images/gatsu.png');"></div><div class="mini-img" style="background-image: url('./images/nankotsu.png');"></div></div>
                </div>
            </div>
            <div id="result-area"></div>
            <ul id="ranking-display" style="list-style:none; padding:0; text-align:center; color:#ffcc00; font-size:14px; margin:5px 0;"></ul>
            <button id="start-btn-id" class="action-btn" onclick="startGame()">宴開始</button>
            <button id="return-btn-id" class="action-btn return-btn" onclick="resetMenu()">戻る</button>
        </div>
        <div id="ui-layer"><div id="hp-display"></div><div id="score-board">0点</div><div id="combo-display"></div></div>
        <div id="player"></div>
    </div>

    <div id="controls"><button class="btn" onclick="moveLeft()">◀</button><button class="btn" onclick="moveRight()">▶</button></div>

    <script>
        const screen = document.getElementById('game-screen'), flash = document.getElementById('damage-flash'), player = document.getElementById('player'), titleScreen = document.getElementById('title-screen');
        const scoreDisplay = document.getElementById('score-board'), hpDisplay = document.getElementById('hp-display'), comboDisplay = document.getElementById('combo-display');
        const bgDangerLayer = document.getElementById('bg-danger');
        
        const sounds = {
            bgm: new Audio('./audio/bgm.mp3'), move: new Audio('./audio/move.mp3'), damage: new Audio('./audio/damage.mp3'), siren: new Audio('./audio/siren.mp3'), heal: new Audio('./audio/heal.mp3'), get: new Audio('./audio/get.mp3')
        };
        sounds.bgm.loop = true; sounds.siren.loop = true;

        let score, hp, combo, playerLine, isGameRunning = false, spawnInterval, bgInterval, charInterval;
        let lastLine = -1, baseFallSpeed = 1.3, autoHealCounter = 0, umewariLotteryCounter = 0, currentPlayerImgIdx = 1, lastPlaybackRate = 1.0;
        let charProbBase = 0.10, lastBgIdx = 0, lastSwitchTime = 0;
        const totalLines = 5, lineWidth = 360 / totalLines;

        const motsuScore = [{ img: './images/shiro.png', type: 'score' }, { img: './images/hatsu.png', type: 'score' }, { img: './images/lever.png', type: 'score' }, { img: './images/abura.png', type: 'score' }, { img: './images/kasira.png', type: 'score' }];
        const motsuDanger = [{ img: './images/gatsu.png', type: 'damage' }, { img: './images/nankotsu.png', type: 'damage' }];

        window.onload = updateRankingDisplay;

        function updateRankingDisplay() {
            const scores = JSON.parse(localStorage.getItem('motsuHighScores')) || [0, 0, 0];
            document.getElementById('ranking-display').innerHTML = scores.map((s, i) => `<li>${i+1}位: ${s}点</li>`).join('');
        }

        async function startGame() {
            if (isGameRunning) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) { const ctx = new AudioContext(); if (ctx.state === 'suspended') await ctx.resume(); }
                for (let k in sounds) { sounds[k].muted = true; await sounds[k].play().then(() => { sounds[k].pause(); sounds[k].muted = false; sounds[k].currentTime = 0; }).catch(()=>{}); }
                sounds.bgm.playbackRate = 1.0; await sounds.bgm.play();
            } catch (e) {}

            score = 0; hp = 3; combo = 0; playerLine = 2; baseFallSpeed = 1.3; autoHealCounter = 0; umewariLotteryCounter = 0; charProbBase = 0.10;
            isGameRunning = true; titleScreen.style.display = 'none'; bgDangerLayer.classList.remove('danger-active');
            updateUI(); updatePlayerPos(false);
            
            // 背景ランダム切り替えタイマー
            lastSwitchTime = Date.now();
            bgInterval = setInterval(() => {
                const now = Date.now();
                if (now - lastSwitchTime >= 30000) {
                    const bgs = document.querySelectorAll('.bg-layer');
                    bgs.forEach(b => b.classList.remove('bg-active'));
                    
                    let nextIdx;
                    do {
                        nextIdx = Math.floor(Math.random() * bgs.length);
                    } while (nextIdx === lastBgIdx); // 前回と同じ背景にならないようにする
                    
                    bgs[nextIdx].classList.add('bg-active');
                    lastBgIdx = nextIdx;
                    lastSwitchTime = now;
                }
            }, 1000);

            charInterval = setInterval(() => {
                if (score >= 1000) { charProbBase = Math.min(charProbBase + 0.01, 0.80); }
            }, 2000);

            spawnInterval = setInterval(spawnMotsu, 1400);
        }

        function gameOver() {
            isGameRunning = false; clearInterval(spawnInterval); clearInterval(bgInterval); clearInterval(charInterval);
            sounds.bgm.pause(); sounds.siren.pause(); sounds.damage.play();
            player.classList.add('shivering');
            flash.style.opacity = "0.7"; setTimeout(() => flash.style.opacity = "0", 600);
            document.querySelectorAll('.motsu').forEach(m => m.remove());
            setTimeout(() => {
                let scores = JSON.parse(localStorage.getItem('motsuHighScores')) || [0, 0, 0];
                scores.push(score); scores.sort((a, b) => b - a);
                localStorage.setItem('motsuHighScores', JSON.stringify(scores.slice(0, 3)));
                updateRankingDisplay();
                titleScreen.style.display = 'flex';
                document.getElementById('result-area').innerHTML = `<h2 style="color:red;margin:5px;">おなかをこわした！！</h2><p style="font-size:20px;">記録: ${score}点</p>`;
                document.getElementById('start-btn-id').style.display = 'none';
                document.getElementById('return-btn-id').style.display = 'block';
            }, 600);
        }

        function resetMenu() {
            document.getElementById('result-area').innerHTML = "";
            document.getElementById('start-btn-id').style.display = 'block';
            document.getElementById('return-btn-id').style.display = 'none';
            updateRankingDisplay();
        }

        function updateUI() {
            hpDisplay.innerText = "体力: " + "❤️".repeat(Math.max(0, hp));
            scoreDisplay.innerText = score + "点";
            comboDisplay.innerText = "コンボ: " + combo;
            if (hp === 1 && isGameRunning) {
                bgDangerLayer.classList.add('danger-active');
                if (sounds.siren.paused) sounds.siren.play();
            } else {
                bgDangerLayer.classList.remove('danger-active');
                sounds.siren.pause();
            }
        }

        function updatePlayerPos(s = true) {
            player.style.left = (playerLine * lineWidth + (lineWidth - 70)/2) + 'px';
            if (s) { 
                currentPlayerImgIdx = (currentPlayerImgIdx === 1) ? 2 : 1;
                player.style.backgroundImage = `url('./images/player${currentPlayerImgIdx}.png')`;
                sounds.move.currentTime = 0; sounds.move.play(); 
            }
        }

        window.moveLeft = () => { if(playerLine > 0 && isGameRunning) { playerLine--; updatePlayerPos(); } };
        window.moveRight = () => { if(playerLine < totalLines - 1 && isGameRunning) { playerLine++; updatePlayerPos(); } };

        function spawnMotsu() {
            if (!isGameRunning) return;
            let line; do { line = Math.floor(Math.random() * totalLines); } while (line === lastLine);
            lastLine = line;
            const motsu = document.createElement('div');
            let dangerProb = 0.28 + Math.min(score / 10000, 0.12);
            let data;
            let currentFallSpeed = baseFallSpeed;

            if (umewariLotteryCounter >= 14 && Math.random() < 0.25) {
                umewariLotteryCounter = 0; data = { img: './images/umewari.png', type: 'item' }; motsu.classList.add('item-umewari');
            } else if (Math.random() < dangerProb) {
                data = motsuDanger[Math.floor(Math.random() * motsuDanger.length)];
                if (Math.random() < charProbBase) {
                    currentFallSpeed *= 3.0;
                    motsu.classList.add('char-mode');
                }
            } else {
                data = motsuScore[Math.floor(Math.random() * motsuScore.length)];
            }
            motsu.className = 'motsu'; motsu.style.backgroundImage = `url('${data.img}')`;
            motsu.style.left = (line * lineWidth + (lineWidth - 60)/2) + 'px';
            motsu.style.top = '-70px'; screen.appendChild(motsu);

            baseFallSpeed += 0.005;
            let targetRate = 1.0 + (baseFallSpeed - 1.3) * 0.15;
            if (Math.abs(targetRate - lastPlaybackRate) > 0.05 && targetRate < 2.0) {
                sounds.bgm.playbackRate = targetRate; lastPlaybackRate = targetRate;
            }

            let top = -70;
            function fall() {
                if (!isGameRunning) { motsu.remove(); return; }
                top += currentFallSpeed; motsu.style.top = top + 'px';
                if (top > 380 && top < 450 && line === playerLine) { handleColl(data); motsu.remove(); return; }
                if (top > 500) { motsu.remove(); return; }
                requestAnimationFrame(fall);
            }
            requestAnimationFrame(fall);
        }

        function handleColl(d) {
            if (d.type === 'damage') {
                hp--; combo = 0; sounds.damage.play();
                flash.style.opacity = "0.7"; setTimeout(() => flash.style.opacity = "0", 150);
                if (hp <= 0) gameOver();
            } else if (d.type === 'item') {
                if (hp < 3) hp++; sounds.heal.play();
            } else {
                combo++; score += 10; autoHealCounter++; umewariLotteryCounter++;
                sounds.get.currentTime = 0; sounds.get.play();
                if (autoHealCounter >= 10) { autoHealCounter = 0; if (hp < 3) { hp++; sounds.heal.play(); } }
            }
            updateUI();
        }
    </script>
</body>
</html>
